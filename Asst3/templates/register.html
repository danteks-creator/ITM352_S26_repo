{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>

<form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="{{ request.form.get('username', '') }}" required>
        <small style="color: #666;">3-20 characters, letters/numbers/underscore only</small>
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <small style="color: #666;">At least 6 characters, must include a number</small>
    </div>

    <div class="form-group">
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </div>

    <button type="submit" class="btn btn-primary">Create Account</button>
</form>

<p>Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
{% endblock %}
